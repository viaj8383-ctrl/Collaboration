<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Responsive Navbar</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        background: #f4f4f4;
      }

      /* Navbar */
      .navbar {
        width: 100%;
        background: #111827;
        padding: 15px 40px;

        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      /* Logo */
      .logo {
        color: white;
        font-size: 28px;
        font-weight: bold;
        text-decoration: none;
      }

      /* Nav Links */
      .nav-links {
        display: flex;
        gap: 25px;
        list-style: none;
      }

      .nav-links a {
        color: white;
        text-decoration: none;
        font-size: 18px;
        transition: 0.3s;
      }

      .nav-links a:hover {
        color: #38bdf8;
      }

      /* Button */
      .btn {
        background: #38bdf8;
        color: white;
        padding: 10px 18px;
        border-radius: 6px;
        text-decoration: none;
        transition: 0.3s;
      }

      .btn:hover {
        background: #0ea5e9;
      }

      /* Mobile Menu */
      .menu-btn {
        display: none;
        font-size: 28px;
        color: white;
        cursor: pointer;
      }

      #menu-toggle {
        display: none;
      }

      /* Responsive */
      @media (max-width: 768px) {
        .menu-btn {
          display: block;
        }

        .nav-links {
          position: absolute;
          top: 70px;
          left: 0;
          width: 100%;
          background: #111827;

          flex-direction: column;
          align-items: center;
          gap: 20px;

          padding: 20px 0;

          display: none;
        }

        #menu-toggle:checked ~ .nav-links {
          display: flex;
        }

        .btn {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <nav class="navbar">
      <!-- Logo -->
      <a href="#" class="logo">MyLogo</a>

      <!-- Mobile Menu Button -->
      <label for="menu-toggle" class="menu-btn">&#9776;</label>
      <input type="checkbox" id="menu-toggle" />

      <!-- Links -->
      <ul class="nav-links">
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Services</a></li>
        <li><a href="#">Contact</a></li>
      </ul>

      <!-- Button -->
      <a href="#" class="btn">Login</a>
    </nav>
  </body>
</html>
